networks:
  redis-cluster-compose:
    driver: bridge

services:
  rabbitmq:
    networks:
      - redis-cluster-compose
    image: rabbitmq:management-alpine
    container_name: rabbit-mq-container
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_ERLANG_COOKIE=rabbitmqCookie
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin

  redis-node-1:
    networks:
      - redis-cluster-compose
    image: redis
    hostname: redis-node-1
    container_name: redis-test1
    volumes:
      - ./conf/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -h redis-node-1 -p 6379 ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  redis-node-2:
    networks:
      - redis-cluster-compose
    image: redis
    hostname: redis-node-2
    container_name: redis-test2
    volumes:
      - ./conf/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -h redis-node-2 -p 6379 ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6380:6379"

  redis-node-3:
    networks:
      - redis-cluster-compose
    image: redis
    hostname: redis-node-3
    container_name: redis-test3
    volumes:
      - ./conf/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -h redis-node-3 -p 6379 ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6381:6379"

  slave-node-1:
    networks:
      - redis-cluster-compose
    image: redis
    hostname: slave-node-1
    container_name: redis-slave-test1
    volumes:
      - ./conf/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -h slave-node-1 -p 6379 ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6382:6379"

  slave-node-2:
    networks:
      - redis-cluster-compose
    image: redis
    hostname: slave-node-2
    container_name: redis-slave-test2
    volumes:
      - ./conf/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -h slave-node-2 -p 6379 ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6383:6379"

  slave-node-3:
    networks:
      - redis-cluster-compose
    image: redis
    hostname: slave-node-3
    container_name: redis-slave-test3
    volumes:
      - ./conf/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -h slave-node-3 -p 6379 ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6384:6379"

  redis-cluster-entry:
    networks:
      - redis-cluster-compose
    image: redis
    restart: no
    container_name: redis-cluster-entry
    #command: redis-cli --cluster create 127.0.0.1:6379 127.0.0.1:6380 127.0.0.1:6381 127.0.0.1:6382 127.0.0.1:6383 127.0.0.1:6384 --cluster-replicas 1 --cluster-yes
    command: sh -c "redis-cli --cluster create redis-node-1:6379 redis-node-2:6379 redis-node-3:6379 slave-node-1:6379 slave-node-2:6379 slave-node-3:6379 --cluster-replicas 1 --cluster-yes && tail -f /dev/null"
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - slave-node-1
      - slave-node-2
      - slave-node-3

  spring-1:
    build: .
    networks:
      - redis-cluster-compose
    expose:
      - "8080"
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
      slave-node-1:
        condition: service_healthy
      slave-node-2:
        condition: service_healthy
      slave-node-3:
        condition: service_healthy

  spring-2:
    build: .
    networks:
      - redis-cluster-compose
    expose:
      - "8080"
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
      slave-node-1:
        condition: service_healthy
      slave-node-2:
        condition: service_healthy
      slave-node-3:
        condition: service_healthy

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d     # 예: default.conf
    depends_on:
      - spring-1
      - spring-2
    networks:
      - redis-cluster-compose